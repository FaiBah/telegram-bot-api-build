name: Build Telegram Bot API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            g++ \
            make \
            cmake \
            gperf \
            zlib1g-dev \
            libssl-dev

      - name: Clone upstream source
        run: |
          git clone --recursive \
            https://github.com/tdlib/telegram-bot-api.git

      - name: Get upstream version
        id: version
        run: |
          cd telegram-bot-api

          VERSION=$(sed -n \
            's/.*project(TelegramBotApi VERSION \([^ ]*\).*/\1/p' \
            CMakeLists.txt)

          if [ -z "$VERSION" ]; then
            echo "Could not detect upstream version."
            exit 1
          fi

          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Upstream version: $TAG"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist."
          fi

      - name: Build
        if: steps.release.outputs.exists != 'true'
        run: |
          cd telegram-bot-api

          mkdir build
          cd build

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/api" \
            ..

          cmake --build . \
            --target install \
            --parallel 2

      - name: Verify output
        if: steps.release.outputs.exists != 'true'
        run: |
          ls -lh api/bin/
          file api/bin/telegram-bot-api

      - name: Package
        if: steps.release.outputs.exists != 'true'
        run: |
          tar -czf \
            "telegram-bot-api-linux-x64-${{ steps.version.outputs.tag }}.tar.gz" \
            -C api .

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create \
            "$TAG" \
            "telegram-bot-api-linux-x64-${TAG}.tar.gz" \
            --title "Telegram Bot API $TAG" \
            --notes "Prebuilt Telegram Bot API $TAG for Linux x64."

      - name: Already up to date
        if: steps.release.outputs.exists == 'true'
        run: |
          echo "Telegram Bot API ${{ steps.version.outputs.tag }} already exists."
          echo "Nothing to build."
