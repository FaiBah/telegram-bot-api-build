name: Build Telegram Bot API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            g++ \
            make \
            cmake \
            gperf \
            zlib1g-dev \
            libssl-dev

      - name: Get latest upstream version
        id: version
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/tdlib/telegram-bot-api/releases/latest \
            | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest version: $VERSION"

      - name: Clone latest source
        run: |
          git clone --recursive \
            --branch "${{ steps.version.outputs.version }}" \
            https://github.com/tdlib/telegram-bot-api.git

      - name: Build
        run: |
          cd telegram-bot-api

          mkdir build
          cd build

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/api" \
            ..

          cmake --build . \
            --target install \
            --parallel 2

      - name: Package
        run: |
          tar -czf \
            "telegram-bot-api-linux-x64-${{ steps.version.outputs.version }}.tar.gz" \
            -C api .

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${{ steps.version.outputs.version }}" \
            "telegram-bot-api-linux-x64-${{ steps.version.outputs.version }}.tar.gz" \
            --title "Telegram Bot API ${{ steps.version.outputs.version }}" \
            --notes "Prebuilt Telegram Bot API ${{ steps.version.outputs.version }} for Linux x64."
