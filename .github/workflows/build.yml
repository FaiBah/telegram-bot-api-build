name: Build Telegram Bot API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone upstream source
        run: |
          git clone --recursive \
            https://github.com/tdlib/telegram-bot-api.git

      - name: Get upstream version
        id: version
        run: |
          cd telegram-bot-api

          VERSION=$(sed -n \
            's/^[[:space:]]*project(TelegramBotApi VERSION \([^ )]*\).*/\1/p' \
            CMakeLists.txt \
            | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not detect Telegram Bot API version."
            exit 1
          fi

          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Upstream version: $TAG"

      - name: Check existing release
        id: release_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.version.outputs.tag }}")

          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists."
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} does not exist."
          else
            echo "GitHub API returned HTTP $STATUS"
            exit 1
          fi

      - name: Restore CMake cache
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: |
            telegram-bot-api/build
            ~/.cache
          key: telegram-bot-api-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.tag }}
          restore-keys: |
            telegram-bot-api-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.release_check.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            make \
            cmake \
            gperf \
            zlib1g-dev \
            libssl-dev

      - name: Build
        if: steps.release_check.outputs.exists != 'true'
        run: |
          cd telegram-bot-api

          mkdir -p build
          cd build

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/api" \
            ..

          cmake --build . \
            --target install \
            --parallel 2

      - name: Verify output
        if: steps.release_check.outputs.exists != 'true'
        run: |
          test -f api/bin/telegram-bot-api

          ls -lh api/bin/telegram-bot-api

          file api/bin/telegram-bot-api

      - name: Package
        if: steps.release_check.outputs.exists != 'true'
        run: |
          tar -czf \
            "telegram-bot-api-linux-x64-${{ steps.version.outputs.tag }}.tar.gz" \
            -C api .

          ls -lh \
            "telegram-bot-api-linux-x64-${{ steps.version.outputs.tag }}.tar.gz"

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Telegram Bot API ${{ steps.version.outputs.tag }}
          body: |
            Prebuilt Telegram Bot API ${{ steps.version.outputs.tag }}
            for Linux x64.
          files: |
            telegram-bot-api-linux-x64-${{ steps.version.outputs.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Already up to date
        if: steps.release_check.outputs.exists == 'true'
        run: |
          echo "Telegram Bot API ${{ steps.version.outputs.tag }} already exists."
          echo "No build required."
